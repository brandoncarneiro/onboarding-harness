name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    name: Tests, types, licenses and secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install checksum-verified Gitleaks
        run: |
          node scripts/install-gitleaks.mjs "$RUNNER_TEMP/gitleaks-bin"
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: License compliance
        run: |
          python3 -m venv "$RUNNER_TEMP/reuse-venv"
          "$RUNNER_TEMP/reuse-venv/bin/python" -m pip install 'reuse[charset-normalizer]==6.3.0'
          "$RUNNER_TEMP/reuse-venv/bin/reuse" lint
      - name: Full-history secret scan
        run: npm run check:secrets
