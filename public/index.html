<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Intake</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, sans-serif;
        line-height: 1.5;
      }
      main {
        box-sizing: border-box;
        max-width: 40rem;
        height: 100vh;
        height: 100dvh;
        margin: 0 auto;
        padding: 1.25rem 1rem 1rem;
        display: flex;
        flex-direction: column;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.25rem;
      }
      #log {
        white-space: pre-wrap;
        flex: 1;
        min-height: 0;
        margin: 1rem 0;
        overflow: auto;
      }
      form {
        display: grid;
        gap: 0.5rem;
      }
      input,
      button {
        font: inherit;
        padding: 0.55rem 0.7rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Intake</h1>
      <p>Send a message. This page posts to the same HTTP API as Telegram.</p>
      <div id="log" aria-live="polite"></div>
      <form id="chat">
        <label for="message">Message</label>
        <input id="message" name="message" autocomplete="off" required />
        <button type="submit">Send</button>
      </form>
    </main>
    <script>
      const log = document.querySelector("#log");
      const form = document.querySelector("#chat");
      const input = document.querySelector("#message");
      const storageKey = "onboarding-harness-session";
      let sessionId = sessionStorage.getItem(storageKey);
      if (!sessionId) {
        sessionId = crypto.randomUUID();
        sessionStorage.setItem(storageKey, sessionId);
      }

      const button = form.querySelector("button");

      function add(text) {
        log.textContent += (log.textContent ? "\n\n" : "") + text;
        log.scrollTop = log.scrollHeight;
      }

      async function post(message, showUser) {
        if (showUser) add("You: " + message);
        button.disabled = true;
        input.disabled = true;
        try {
          const response = await fetch("/api/chat", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ sessionId, message }),
          });
          const payload = await response.json();
          add(payload.reply || payload.error || "The message was not accepted.");
        } catch {
          add("The message was not sent.");
        } finally {
          button.disabled = false;
          input.disabled = false;
          input.focus();
        }
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const message = input.value;
        input.value = "";
        void post(message, true);
      });

      void post("start", false);
    </script>
  </body>
</html>
